<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" role="img">
  <title>Emil Krebs — public index</title>
  <style>
    .card-bg { fill: #f7f5f0; }
    .card-line { stroke: rgba(20,19,16,0.14); }
    .muted { fill: #6e6a63; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    .h-name { font-size: 56px; font-weight: 800; letter-spacing: -0.02em; }
    .h-role { font-size: 20px; font-weight: 600; }
    .h-tag { font-size: 15px; font-weight: 400; }
    .m-line { font-size: 12px; font-weight: 500; letter-spacing: 0.14em; }
    @media (prefers-color-scheme: dark) {
      .card-bg { fill: #1c1915; }
      .card-line { stroke: rgba(247,245,240,0.14); }
      .ink { fill: #f7f5f0; }
      .muted { fill: #9b968c; }
    }
  </style>
  <rect x="0" y="0" width="840" height="200" class="card-bg"/>
  <rect x="0.5" y="0.5" width="839" height="199" fill="none" class="card-line" stroke-width="1"/>

  <text x="40" y="34" class="mono m-line muted">PUBLIC INDEX</text>
  <text x="800" y="34" text-anchor="end" class="mono m-line muted">KIEL, GERMANY</text>
  <line x1="40" y1="50" x2="800" y2="50" class="card-line" stroke-width="1"/>

  <text x="40" y="120" class="sans h-name ink">Emil Krebs</text>
  <text x="40" y="150" class="sans h-role ink">Software Engineer at TypeFox GmbH</text>
  <text x="40" y="176" class="sans h-tag muted">Developer tooling, privacy-first software, and evidence-based health tools.</text>

  <g transform="translate(704 80) scale(1.5)">
    <rect x="8" y="28" width="8" height="8" fill="#e8450c"/>
    <rect x="20" y="28" width="8" height="8" fill="#e8450c"/>
    <rect x="32" y="28" width="8" height="8" fill="#e8450c"/>
    <rect x="44" y="28" width="8" height="8" fill="#e8450c"/>
  </g>
</svg>
