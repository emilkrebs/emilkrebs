<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img">
  <title>Emil Krebs — public index</title>
  <style>
    .card-bg { fill: #f7f5f0; }
    .card-line { stroke: rgba(20,19,16,0.14); }
    .ink { fill: #141310; }
    .muted { fill: #6e6a63; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    .h-name { font-size: 60px; font-weight: 800; letter-spacing: -0.02em; }
    .m-line { font-size: 17px; font-weight: 500; letter-spacing: 0.1em; }
    .m-val { font-weight: 600; letter-spacing: 0.02em; }
    @media (prefers-color-scheme: dark) {
      .card-bg { fill: #1c1915; }
      .card-line { stroke: rgba(247,245,240,0.14); }
      .ink { fill: #f7f5f0; }
      .muted { fill: #9b968c; }
    }
  </style>
  <rect x="0" y="0" width="1200" height="150" class="card-bg"/>
  <rect x="0.5" y="0.5" width="1199" height="149" fill="none" class="card-line" stroke-width="1"/>

  <text x="56" y="92" class="sans h-name ink">Emil Krebs</text>

  <text x="1144" y="60" text-anchor="end" class="mono m-line muted">ROLE  <tspan class="ink m-val">SOFTWARE ENGINEER</tspan></text>
  <text x="1144" y="88" text-anchor="end" class="mono m-line muted">EMPLOYER  <tspan class="ink m-val">TYPEFOX GMBH — KIEL</tspan></text>

  <line x1="56" y1="124" x2="1144" y2="124" class="card-line" stroke-width="1"/>
</svg>
